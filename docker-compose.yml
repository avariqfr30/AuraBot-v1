services:
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: aurabot-chromadb
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      ALLOW_RESET: "FALSE"
    volumes:
      - "${AURA_CHROMA_DOCKER_PATH:?Use npm run chroma:up:docker so the runtime path is validated}:/chroma/chroma"
    restart: unless-stopped
