services:
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: aurabot-chromadb
    ports:
      - "8000:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      ALLOW_RESET: "FALSE"
    volumes:
      - ./chroma-data:/chroma/chroma
    restart: unless-stopped
